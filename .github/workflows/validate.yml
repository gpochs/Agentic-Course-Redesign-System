name: Validate public release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate source tree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 05_Validation/validate_repository.py

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s 05_Validation/tests -v

      - name: Validate inactive shared state
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 03_Shared_Workflow_Core/scripts/validate_state.py 03_Shared_Workflow_Core/course-project-template/01_Control/state.json

      - name: Validate ChatGPT Desktop plugin source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd 01_ChatGPT_Desktop_App
          python validation/public_scrub.py
          python validation/validate_static_formats.py
          python validation/validate_public_submission.py
          python -m unittest discover -s plugins/agentic-course-redesign/tests -p "test_*.py" -v
          python plugins/agentic-course-redesign/scripts/validate_state.py plugins/agentic-course-redesign/assets/project-template/01_Control/state.json
          python validation/forward_test.py
          python validation/check_release_build.py
          python validation/check_public_submission_build.py

      - name: Validate Copilot, Claude Code and OpenCode adapters
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 02_Other_Agentic_Systems/00_Portable_Core_Adapter/validation/validate_adapters.py

      - name: Validate Google Antigravity adapter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd 02_Other_Agentic_Systems/04_Google_Antigravity
          python validation/validate_adapter.py
          python -m unittest discover -s validation -p "test_*.py" -v
          python workspace-overlay/.agents/skills/course-redesign-setup/scripts/validate_state.py workspace-overlay/01_Control/state.json

      - name: Build deterministic release twice
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          python 05_Validation/build_release.py --version 0.2.1 > "$RUNNER_TEMP/first.json"
          first=$(python -c "import json, os; print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'first.json')))['archive_sha256'])")
          python 05_Validation/build_release.py --version 0.2.1 > "$RUNNER_TEMP/second.json"
          second=$(python -c "import json, os; print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'second.json')))['archive_sha256'])")
          test "$first" = "$second"
          python 05_Validation/validate_release.py dist/Agentic-Course-Redesign-System_v0.2.1.zip
